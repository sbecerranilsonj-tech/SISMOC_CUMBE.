{% load l10n %}
<div class="kpi-grid analytics-cards">
<section class="kpi-box analytics-card"><h3>Con marcación hoy</h3><div class="analytics-number"><strong id="kpiPresentes">{{ info_huellero.total_presentes_hoy }}</strong><span>trabajadores</span></div><figure class="mini-columns" data-bars><figcaption class="visually-hidden">Primera marcación de hoy, por franja de cuatro horas</figcaption>{% for punto in marcaciones_horas %}<div class="mini-column" data-bar-value="{{ punto.valor }}"><span class="column-count">{{ punto.valor }}</span><div class="column-track"><i></i></div><span>{{ punto.nombre }}</span></div>{% endfor %}</figure></section>
<section class="kpi-box analytics-card"><h3>Horas extras del periodo</h3><figure class="horizontal-chart" data-bars><figcaption class="visually-hidden">Horas extras al 25 y al 35 por ciento</figcaption><div class="horizontal-row" data-bar-value="{{ totales_asistencia.horas_extras_25|unlocalize }}"><span>25 %</span><strong>{{ totales_asistencia.horas_extras_25|floatformat:2 }} h</strong><div class="horizontal-track"><i></i></div></div><div class="horizontal-row secondary" data-bar-value="{{ totales_asistencia.horas_extras_35|unlocalize }}"><span>35 %</span><strong>{{ totales_asistencia.horas_extras_35|floatformat:2 }} h</strong><div class="horizontal-track"><i></i></div></div></figure></section>
<section class="kpi-box analytics-card"><h3>Jornadas por revisar</h3><div class="analytics-number"><strong>{{ conteos_resumen.PENDIENTE|add:conteos_resumen.OBSERVADO }}</strong><span>jornadas</span></div><figure class="horizontal-chart" data-bars><figcaption class="visually-hidden">Pendientes y observadas del periodo</figcaption><div class="horizontal-row warning" data-bar-value="{{ conteos_resumen.PENDIENTE }}"><span>Pendientes</span><strong>{{ conteos_resumen.PENDIENTE }}</strong><div class="horizontal-track"><i></i></div></div><div class="horizontal-row danger" data-bar-value="{{ conteos_resumen.OBSERVADO }}"><span>Observadas</span><strong>{{ conteos_resumen.OBSERVADO }}</strong><div class="horizontal-track"><i></i></div></div></figure></section>
<section class="kpi-box analytics-card"><h3>Personal activo</h3><div class="analytics-number"><strong>{{ total_usuarios }}</strong><span>activos</span></div><figure class="horizontal-chart personnel-chart" data-bars><figcaption class="visually-hidden">Personal activo por sede</figcaption>{% for punto in personal_series %}<div class="horizontal-row" data-bar-value="{{ punto.valor }}"><span title="{{ punto.nombre }}">{{ punto.nombre }}</span><strong>{{ punto.valor }}</strong><div class="horizontal-track"><i></i></div></div>{% empty %}<span class="chart-empty">Sin personal activo</span>{% endfor %}</figure></section>
</div>

<section class="content-panel today-banner" aria-labelledby="hoy-titulo">

    <div class="today-total"><strong>{{ info_huellero.total_presentes_hoy }}</strong><span>personas con marcación hoy</span></div>
    <button type="button" class="btn-dark-outline today-action" onclick="mostrarSeccion('huellero')"><span>Ver marcaciones</span><svg class="ui-icon" aria-hidden="true"><use href="#icon-arrow"></use></svg></button>
</section>

<section class="content-panel dashboard-chart"><div><h3 class="panel-title-text">Estado de jornadas</h3><ul class="chart-legend"><li><i class="state-dot approved" aria-hidden="true"></i><a href="{% querystring vista='asistencia' listado='jornadas' revision='APROBADO' pagina=None persona_dni=None detalle=None %}">Aprobadas</a><strong>{{ conteos_resumen.APROBADO }}</strong></li><li><i class="state-dot pending" aria-hidden="true"></i><a href="{% querystring vista='asistencia' listado='jornadas' revision='PENDIENTE' pagina=None persona_dni=None detalle=None %}">Pendientes</a><strong>{{ conteos_resumen.PENDIENTE }}</strong></li><li><i class="state-dot observed" aria-hidden="true"></i><a href="{% querystring vista='asistencia' listado='jornadas' revision='OBSERVADO' pagina=None persona_dni=None detalle=None %}">Observadas</a><strong>{{ conteos_resumen.OBSERVADO }}</strong></li></ul></div><div class="jornadas-donut" data-jornadas-chart data-approved="{{ conteos_resumen.APROBADO }}" data-pending="{{ conteos_resumen.PENDIENTE }}" data-observed="{{ conteos_resumen.OBSERVADO }}"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="46" fill="none" stroke="var(--ds-line)" stroke-width="12"/>{% for clase in 'abc' %}<circle data-chart-segment cx="60" cy="60" r="46" fill="none" stroke-width="12" transform="rotate(-90 60 60)"/>{% endfor %}</svg><div><strong>{{ total_resumen }}</strong><span>jornadas</span></div></div></section>

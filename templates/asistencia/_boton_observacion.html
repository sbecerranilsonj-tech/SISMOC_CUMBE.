<div class="day-observation-inline" style="display:flex;align-items:center;flex-wrap:wrap;gap:10px;min-width:0;max-width:100%"><button type="button" class="btn-dark-outline btn-agregar-marca" onclick="document.getElementById('observacion-dia-dialog').showModal()" aria-haspopup="dialog" aria-controls="observacion-dia-dialog" title="{% if d.resumen.observacion_dia %}Ver o editar observación guardada{% else %}Agregar observación del día{% endif %}"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2V11.5A8.5 8.5 0 0 1 10.5 3h2A8.5 8.5 0 0 1 21 11.5Z"/><path d="M7 9h9M7 13h6"/></svg><span>Observación{% if d.resumen.observacion_dia %} · Guardada{% endif %}</span></button>{% if d.resumen.observacion_dia %}<p class="day-observation-text" style="margin:0;max-width:48ch;white-space:pre-wrap;overflow-wrap:anywhere;font-size:0.875rem;line-height:1.5">{{ d.resumen.observacion_dia }}</p>{% endif %}</div>

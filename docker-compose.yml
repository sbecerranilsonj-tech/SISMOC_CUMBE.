version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sismoc-cumbe-db
    restart: always
    environment:
      POSTGRES_DB: sismoc_cumbe_db
      POSTGRES_USER: sismoc_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sismoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sismoc_admin -d sismoc_cumbe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: sismoc-cumbe-web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 180"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=sismoc_cumbe_db
      - DB_USER=sismoc_admin
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - ZKTECO_PORT=4370
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sismoc-cumbe-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      - db

volumes:
  sismoc_pgdata:
